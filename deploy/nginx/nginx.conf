# ==============================================================================
# SovereignMsg - Configuration Nginx Reverse Proxy (deploy/nginx/nginx.conf)
# ==============================================================================
# RÈGLES DE SÉCURITÉ ET DÉFENSE EN PROFONDEUR :
# 1. Seul le port 443 (HTTPS) est accessible de l'extérieur
# 2. TLS v1.2 / TLS v1.3 avec suites cryptographiques fortes
# 3. En-têtes de sécurité HSTS, CSP stricte (avec wasm-unsafe-eval pour Rust Crypto)
# 4. Blocage ABSOLU depuis l'extérieur de :
#    - /_synapse/admin (toutes sous-routes)
#    - /_matrix/client/*/login (r0, v3, unstable, etc.)
#    - /_matrix/client/*/register (r0, v3, unstable, etc.)
# 5. Limitation de débit stricte sur /api/auth/* (5 requêtes/minute par IP)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Format de logs sans journalisation de corps ni de tokens
    log_format sovereign_log '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $request_uri $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log sovereign_log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Limitations de débit (Défense contre attaques par déni de service et force brute)
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_status 429;

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # Certificats TLS de démonstration / production
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Protocoles et suites de chiffrement durcis
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # En-têtes de sécurité stricts (OWASP / ANSSI)
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        # ----------------------------------------------------------------------
        # BLOCAGES SÉCURITÉ CRITIQUES (Défense en profondeur)
        # Ces routes ne sont JAMAIS accessibles depuis l'extérieur.
        # Seule la passerelle d'identité sur le réseau Docker interne y accède.
        # ----------------------------------------------------------------------

        # 1. Bloquer l'API d'administration Synapse
        location ~* ^/_synapse/admin {
            default_type application/json;
            return 403 '{"errcode":"M_FORBIDDEN","error":"Acces direct a l administration Matrix strictement interdit depuis l exterieur."}\n';
        }

        # 2. Bloquer les routes de connexion directe Matrix pour TOUTES les versions (r0, v3, unstable, etc.)
        location ~* ^/_matrix/client/[^/]+/login(/.*)?$ {
            default_type application/json;
            return 403 '{"errcode":"M_FORBIDDEN","error":"Connexion directe Matrix interdite. Passez imperativement par la passerelle d identite SovereignMsg."}\n';
        }

        # 3. Bloquer l'inscription publique Matrix pour TOUTES les versions (r0, v3, unstable, etc.)
        location ~* ^/_matrix/client/[^/]+/register(/.*)?$ {
            default_type application/json;
            return 403 '{"errcode":"M_FORBIDDEN","error":"Inscription publique Matrix desactivee."}\n';
        }

        # ----------------------------------------------------------------------
        # Routage Passerelle d'Identité FastAPI (gateway)
        # ----------------------------------------------------------------------
        # Limitation stricte sur l'authentification et l'activation
        location /api/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Autres routes d'API passerelle
        location /api/ {
            limit_req zone=api_general burst=10 nodelay;

            proxy_pass http://gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # Routage Matrix Synapse (autorisé pour la synchronisation client E2EE)
        # ----------------------------------------------------------------------
        location /_matrix/ {
            proxy_pass http://synapse:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Taille maximale des pièces jointes chiffrées
            client_max_body_size 50M;

            # Support HTTP long-polling pour Matrix /sync
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ----------------------------------------------------------------------
        # Distribution du Client PWA Web (React + Vite)
        # ----------------------------------------------------------------------
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Mise en cache du frontend statique (les messages ne sont JAMAIS servis ici)
            location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
            }
        }
    }
}
